agent: agent_v1_08_wstop3
agent_parameters:
  model: gpt-5.6-sol
  reasoning_effort: high
  supervisor_inactivity_timeout_seconds: 7200
environment: life_minecraft
environment_parameters:
  minecraft_task_timeout_seconds: 1800
  difficulty: normal
  hardcore: false
  seed: 123456
  width: 960
  height: 540
  capture_fps: 30
  render_fps: 60
  record_fps: 1
  startup_timeout_seconds: 600
mem_disk_mounts:
  - mount: /latest_frame
    size: 10mb
server_mounts:
  - source: ./run_mc/socket
    target: /run/life-minecraft
games:
  - craft_wooden_pickaxe
  - kill_zombie
accounts: [codex01]
