agent: agent_v1_08_wstop3
agent_parameters:
  model: gpt-6.2-sol
  reasoning_effort: max
agent_docker_build_args:
  CODEX_VERSION: "0.170.0"
environment: minecraft_realtime
environment_parameters:
  minecraft_task_timeout_seconds: 86400 # 24 hours
  difficulty: normal
  hardcore: false
  seed: 123456
  width: 960
  height: 540
  capture_fps: 15
  render_fps: 15
  record_fps: 1
  startup_timeout_seconds: 600
mem_disk_mounts:
  - mount: /latest_frame
    size: 10mb
server_mounts:
  - source: ./run_mc/socket
    target: /run/minecraft-realtime
games:
  - craft_wooden_pickaxe
  - kill_zombie
accounts: [codex01]
